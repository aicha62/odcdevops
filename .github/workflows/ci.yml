name: CI - odcdevops

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilation
        run: mvn compile -B

      - name: Tests
        run: mvn test -B

      - name: Packaging (genere le .jar)
        run: mvn package -DskipTests -B

      - name: Archiver le .jar
        uses: actions/upload-artifact@v4
        with:
          name: odcdevops-jar
          path: target/*.jar

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Construction de l'image Docker
        run: docker build -t odcdevops:latest .
